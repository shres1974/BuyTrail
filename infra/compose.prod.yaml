# Production-style single-server deployment of the BuyTrail demo (D0).
# Usage on the server:  docker compose -f infra/compose.prod.yaml --env-file .env.production up -d --build
# Only Caddy is exposed to the internet (80/443). Postgres, Redis and object storage stay internal.
name: buytrail-prod

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: buytrail-app:latest
  env_file: ../.env.production
  environment:
    DATABASE_URL: postgresql://buytrail:${POSTGRES_PASSWORD}@postgres:5432/buytrail
    REDIS_URL: redis://redis:6379
    OBJECT_STORAGE_ENDPOINT: http://objects:9000
    HOSTNAME: 0.0.0.0
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    objects: { condition: service_started }

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: buytrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: buytrail
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buytrail"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  objects:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-c"]
    # S3 credentials are written from env at start so no secret lives in the repository.
    command:
      - |
        printf '{"identities":[{"name":"buytrail","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -s3 -s3.port=9000 -s3.config=/tmp/s3.json -dir=/data -master.volumeSizeLimitMB=256
    environment:
      S3_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?set OBJECT_STORAGE_ACCESS_KEY}
      S3_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?set OBJECT_STORAGE_SECRET_KEY}
    volumes: [objdata:/data]
    restart: unless-stopped

  # One-shot: apply migrations and the (rerunnable, demo-scoped) seed, then exit.
  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "pnpm db:migrate && pnpm seed:demo"]

  web:
    <<: *app
    command: ["pnpm", "start:web"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["pnpm", "worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env.production}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

  # Nightly logical backup kept on the server (7 most recent). Copy them off-server too.
  backup:
    image: postgres:17
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/buytrail-$$(date -u +%Y%m%dT%H%M%SZ).dump
          pg_dump -h postgres -U buytrail -Fc buytrail > "$$f" && echo "backup ok $$f"
          ls -1t /backups/*.dump | tail -n +8 | xargs -r rm --
          sleep 86400
        done
    volumes: [./backups:/backups]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  objdata:
  caddy_data:
  caddy_config:
